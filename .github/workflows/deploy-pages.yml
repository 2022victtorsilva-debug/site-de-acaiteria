name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Diagnose install, typecheck and build
        id: diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG="$RUNNER_TEMP/pages-build.log"
          : > "$LOG"

          run_check() {
            label="$1"
            shift
            echo "===== $label =====" | tee -a "$LOG"
            "$@" >> "$LOG" 2>&1
            code=$?
            echo "exit_code=$code" | tee -a "$LOG"
            echo | tee -a "$LOG"
            return $code
          }

          set +e
          run_check "npm install" npm install --no-audit --no-fund
          INSTALL_CODE=$?

          if [ "$INSTALL_CODE" -eq 0 ]; then
            run_check "npm run typecheck" npm run typecheck
            TYPECHECK_CODE=$?
            run_check "npm run build" npm run build
            BUILD_CODE=$?
          else
            TYPECHECK_CODE=99
            BUILD_CODE=99
          fi

          {
            echo "===== summary ====="
            echo "commit=$GITHUB_SHA"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "install=$INSTALL_CODE"
            echo "typecheck=$TYPECHECK_CODE"
            echo "build=$BUILD_CODE"
          } >> "$LOG"

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "TEMP Pages build diagnostic $GITHUB_SHA" \
            --body-file "$LOG" || true

          if [ "$INSTALL_CODE" -ne 0 ] || [ "$TYPECHECK_CODE" -ne 0 ] || [ "$BUILD_CODE" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Pages
        id: setup_pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload_pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Verify Pages build phase
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SETUP_OUTCOME: ${{ steps.setup_pages.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_pages.outcome }}
        run: |
          BODY="$RUNNER_TEMP/pages-phase.txt"
          {
            echo "commit=$GITHUB_SHA"
            echo "configure_pages=$SETUP_OUTCOME"
            echo "upload_pages_artifact=$UPLOAD_OUTCOME"
          } > "$BODY"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "TEMP Pages build phase $GITHUB_SHA" \
            --body-file "$BODY" || true

          if [ "$SETUP_OUTCOME" != "success" ] || [ "$UPLOAD_OUTCOME" != "success" ]; then
            exit 1
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Verify Pages deployment
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          BODY="$RUNNER_TEMP/pages-deploy.txt"
          {
            echo "commit=$GITHUB_SHA"
            echo "deploy_pages=$DEPLOY_OUTCOME"
            echo "page_url=$PAGE_URL"
          } > "$BODY"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "TEMP Pages deploy phase $GITHUB_SHA" \
            --body-file "$BODY" || true

          if [ "$DEPLOY_OUTCOME" != "success" ]; then
            exit 1
          fi
