name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Capture mobile rendering
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          sleep 5
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=4500 --window-size=390,4200 --screenshot="$RUNNER_TEMP/mobile.png" "$PAGE_URL" >/dev/null 2>&1
          test -s "$RUNNER_TEMP/mobile.png"

      - name: Upload mobile screenshot
        uses: actions/upload-artifact@v4
        with:
          name: final-image-check
          path: ${{ runner.temp }}/mobile.png
          retention-days: 1

      - name: Record validation run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "TEMP final image check $GITHUB_SHA" --body "run_id=$GITHUB_RUN_ID\npage_url=$PAGE_URL\ncommit=$GITHUB_SHA" || true
