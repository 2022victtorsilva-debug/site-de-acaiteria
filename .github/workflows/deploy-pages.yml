name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Diagnose install, typecheck and build
        id: diagnostics
        shell: bash
        run: |
          mkdir -p .github/diagnostics
          LOG=.github/diagnostics/pages-build.log
          : > "$LOG"

          run_check() {
            label="$1"
            shift
            echo "===== $label =====" | tee -a "$LOG"
            "$@" >> "$LOG" 2>&1
            code=$?
            echo "exit_code=$code" | tee -a "$LOG"
            echo | tee -a "$LOG"
            return $code
          }

          set +e
          run_check "npm install" npm install --no-audit --no-fund
          INSTALL_CODE=$?

          if [ "$INSTALL_CODE" -eq 0 ]; then
            run_check "npm run typecheck" npm run typecheck
            TYPECHECK_CODE=$?
            run_check "npm run build" npm run build
            BUILD_CODE=$?
          else
            TYPECHECK_CODE=99
            BUILD_CODE=99
          fi

          {
            echo "===== summary ====="
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "install=$INSTALL_CODE"
            echo "typecheck=$TYPECHECK_CODE"
            echo "build=$BUILD_CODE"
          } >> "$LOG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LOG"
          git commit -m "chore: capture Pages build log [skip ci]" || true
          git push || true

          if [ "$INSTALL_CODE" -ne 0 ] || [ "$TYPECHECK_CODE" -ne 0 ] || [ "$BUILD_CODE" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
